[project]
name = "alphacouncil"
version = "0.1.0"
description = "Safe PRE-M0 foundation for AlphaCouncil."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.42,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "polars>=1.0,<2",
    "pydantic-settings>=2.10,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts", "tests"]
strict = true
warn_unused_ignores = true

[tool.uv]
package = false
