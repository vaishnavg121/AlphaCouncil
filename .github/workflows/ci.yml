name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --python 3.12
          
      - name: Run Ruff
        run: uv run ruff check backend scripts tests
        
      - name: Run mypy
        run: uv run mypy backend
        
      - name: Run pytest
        run: uv run pytest
        env:
          TRADING_MODE: paper
          ENABLE_EXECUTION: false
          ALPACA_LIVE_TRADE: false